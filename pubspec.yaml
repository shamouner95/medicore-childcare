
name: hospital_app
description: Production-ready Hospital Management App (Flutter + Firebase + Riverpod + go_router + Gemini AI)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.1
  google_generative_ai: ^0.4.6
  flutter_animate: ^4.5.0
  google_fonts: ^8.1.0
  intl: ^0.19.0
  image_picker: ^1.2.1
  image_cropper: ^12.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  google_maps_flutter: ^2.10.0
  http: ^1.2.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
